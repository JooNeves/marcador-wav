<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Marcador WAV</title>
<meta name="description" content="Abre um WAV, lê as marcas (cues) que o Reaper embebe no ficheiro e reproduz saltando de marca em marca.">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Marcador WAV">
<meta name="theme-color" content="#E7EAEE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1116" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./favicon-32.png" sizes="32x32">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
  :root{
    color-scheme: light;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html, body{ margin:0; }
  img{ max-width:100%; }
  [hidden]{ display:none !important; }
</style>
</head>
<body>
<style>
  :root{
    color-scheme: light;
    --bg:#E7EAEE; --surface:#FFFFFF; --surface-2:#F1F4F8; --line:#D2D8E0;
    --ink:#141820; --muted:#5C6675;
    --accent:#1B5FD1; --accent-ink:#FFFFFF;
    --wave:#3C7E9C; --wave-soft:#A9C6D4;
    --marker:#B65216; --marker-soft:#E8C4A7;
    --play:#D22D20;
    --grid:#C9D0DA;
    --shadow:0 1px 2px rgba(20,24,32,.10), 0 8px 24px rgba(20,24,32,.06);
    --r:10px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --bg:#0E1116; --surface:#161A21; --surface-2:#1C222B; --line:#28303B;
      --ink:#E7ECF3; --muted:#8B95A5;
      --accent:#6AA3FF; --accent-ink:#0B1220;
      --wave:#4FA8C9; --wave-soft:#2B5C70;
      --marker:#F0A24A; --marker-soft:#6B4A20;
      --play:#FF5C4D;
      --grid:#2A323E;
      --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 26px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --bg:#0E1116; --surface:#161A21; --surface-2:#1C222B; --line:#28303B;
    --ink:#E7ECF3; --muted:#8B95A5;
    --accent:#6AA3FF; --accent-ink:#0B1220;
    --wave:#4FA8C9; --wave-soft:#2B5C70;
    --marker:#F0A24A; --marker-soft:#6B4A20;
    --play:#FF5C4D;
    --grid:#2A323E;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 26px rgba(0,0,0,.35);
  }

  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size:15px; line-height:1.45;
    -webkit-text-size-adjust:100%;
  }
  *{box-sizing:border-box;}
  button, input{font:inherit; color:inherit;}
  .mono{font-family:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace; font-variant-numeric:tabular-nums;}

  #app{height:100%; display:flex; flex-direction:column; gap:10px; padding:10px 14px 12px;}

  /* ---- top bar ---- */
  .top{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .brand{display:flex; align-items:baseline; gap:8px; margin-right:auto; min-width:0;}
  .brand b{font-weight:700; letter-spacing:-.01em; font-size:17px; white-space:nowrap;}
  .brand span{font-size:12px; color:var(--muted); letter-spacing:.06em; text-transform:uppercase;}

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:7px;
    min-height:40px; padding:0 14px; border-radius:var(--r);
    border:1px solid var(--line); background:var(--surface); color:var(--ink);
    cursor:pointer; font-weight:500; white-space:nowrap;
    -webkit-tap-highlight-color:transparent;
  }
  .btn:active{transform:translateY(1px);}
  .btn:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
  .btn.ghost{background:transparent;}
  .btn[aria-pressed="true"]{background:var(--marker); border-color:var(--marker); color:#fff;}
  .btn:disabled{opacity:.4; cursor:default;}
  .btn.icon{min-width:40px; padding:0 10px;}

  .meta{
    display:flex; gap:6px 14px; flex-wrap:wrap; align-items:baseline;
    font-size:12.5px; color:var(--muted);
  }
  .meta .name{color:var(--ink); font-weight:600; max-width:min(52vw,420px); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .tag{
    font-size:11px; letter-spacing:.07em; text-transform:uppercase; font-weight:600;
    padding:2px 7px; border-radius:999px; border:1px solid var(--marker-soft); color:var(--marker);
  }

  /* ---- waveform ---- */
  .stage{
    position:relative; background:var(--surface); border:1px solid var(--line);
    border-radius:var(--r); box-shadow:var(--shadow); overflow:hidden;
    flex:1 1 auto; min-height:190px;
  }
  canvas{display:block; width:100%; height:100%; touch-action:none;}
  .stage .hint{
    position:absolute; left:10px; bottom:8px; font-size:11.5px; color:var(--muted);
    background:color-mix(in srgb, var(--surface) 85%, transparent); padding:2px 7px; border-radius:6px;
    pointer-events:none;
  }
  .busy{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    background:color-mix(in srgb, var(--surface) 88%, transparent); font-weight:500; gap:10px;
  }
  .spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:sp .8s linear infinite;}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}}

  /* ---- transport ---- */
  .transport{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .clock{
    display:flex; align-items:baseline; gap:8px; margin-left:auto;
    padding:4px 12px; border-radius:var(--r); background:var(--surface); border:1px solid var(--line);
  }
  .clock .now{font-size:20px; font-weight:600; letter-spacing:-.01em;}
  .clock .dur{font-size:12.5px; color:var(--muted);}
  .zoomers{display:flex; gap:6px;}

  /* ---- markers ---- */
  .markers{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
    box-shadow:var(--shadow); display:flex; flex-direction:column;
    flex:0 1 auto; min-height:118px; max-height:42vh; overflow:hidden;
  }
  .markers header{
    display:flex; align-items:center; gap:8px; padding:8px 10px 8px 12px;
    border-bottom:1px solid var(--line); background:var(--surface-2); border-radius:var(--r) var(--r) 0 0;
  }
  .markers header h2{margin:0; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:600;}
  .markers header .count{font-size:12px; color:var(--muted);}
  .markers header .sp{margin-left:auto;}
  .list{overflow-y:auto; -webkit-overflow-scrolling:touch;}
  .row{
    display:flex; align-items:center; gap:8px; padding:6px 8px 6px 10px;
    border-bottom:1px solid var(--line);
  }
  .row:last-child{border-bottom:0;}
  .row.active{background:color-mix(in srgb, var(--marker) 12%, transparent);}
  .row .go{
    display:flex; align-items:center; gap:9px; background:transparent; border:0; padding:6px 4px;
    cursor:pointer; text-align:left; min-height:38px;
  }
  .row .idx{
    min-width:24px; height:22px; padding:0 5px; border-radius:6px;
    background:var(--marker-soft); color:var(--marker); font-size:11.5px; font-weight:600;
    display:inline-flex; align-items:center; justify-content:center;
  }
  .row .t{font-size:14px; font-weight:500;}
  .row .len{font-size:11.5px; color:var(--muted);}
  .row input.nm{
    flex:1 1 auto; min-width:60px; border:1px solid transparent; background:transparent;
    border-radius:7px; padding:7px 8px; font-size:14.5px;
  }
  .row input.nm:focus{border-color:var(--accent); outline:none; background:var(--surface-2);}
  .row .del{
    border:0; background:transparent; color:var(--muted); cursor:pointer;
    min-width:34px; min-height:34px; border-radius:7px; font-size:15px;
  }
  .row .del.arm{background:var(--play); color:#fff; font-size:12px; padding:0 8px; font-weight:600;}
  .empty{padding:18px 14px; color:var(--muted); font-size:13.5px;}
  .empty code{font-family:"IBM Plex Mono",monospace; font-size:12.5px;}

  .toast{
    position:fixed; left:50%; transform:translateX(-50%);
    bottom:calc(14px + env(safe-area-inset-bottom, 0px));
    background:var(--ink); color:var(--bg); padding:9px 15px; border-radius:999px;
    font-size:13.5px; font-weight:500; box-shadow:var(--shadow); z-index:20; max-width:90vw; text-align:center;
  }

  @media (max-width:430px){
    .btn{padding:0 10px;}
    .btn.icon{min-width:38px; padding:0 8px;}
    .brand b{font-size:16px;}
    .top{gap:7px;}
  }
  @media (max-width:560px){
    #app{padding:8px 12px 10px;}
    .clock{width:100%; margin-left:0; justify-content:space-between;}
    .markers{max-height:38vh;}
  }
</style>

<div id="app">
  <div class="top">
    <div class="brand"><b>Marcador WAV</b><span id="ver">v4</span></div>
    <label class="btn primary" for="pick">Abrir áudio</label>
    <input id="pick" type="file" accept="audio/*,.wav,.wave,.mp3,.m4a,.aac,.aif,.aiff,.flac,.ogg,.opus,.caf" hidden>
    <label class="btn" for="pickCsv">Marcas</label>
    <input id="pickCsv" type="file" accept=".csv,.txt,text/csv,text/plain" hidden>
  </div>

  <div class="meta" id="meta"></div>

  <section class="stage">
    <canvas id="cv"></canvas>
    <div class="hint" id="hint">Toca para posicionar &middot; arrasta para deslocar</div>
    <div class="busy" id="busy" hidden><span class="spin"></span><span id="busyTxt">A ler o ficheiro…</span></div>
  </section>

  <div class="transport">
    <button class="btn icon" id="prev" title="Marca anterior" aria-label="Marca anterior">⏮</button>
    <button class="btn primary icon" id="play" style="min-width:64px" aria-label="Reproduzir">▶</button>
    <button class="btn icon" id="next" title="Marca seguinte" aria-label="Marca seguinte">⏭</button>
    <button class="btn" id="loop" aria-pressed="false" title="Repetir o troço entre marcas">Loop</button>
    <div class="zoomers">
      <button class="btn icon" id="zout" aria-label="Afastar">−</button>
      <button class="btn icon" id="zin" aria-label="Aproximar">+</button>
      <button class="btn" id="zfit">Tudo</button>
    </div>
    <div class="clock mono"><span class="now" id="tNow">0:00.000</span><span class="dur" id="tDur">/ 0:00.000</span></div>
  </div>

  <section class="markers">
    <header>
      <h2>Marcas</h2><span class="count" id="mCount">0</span>
      <span class="sp"></span>
      <button class="btn ghost" id="addM">+ Marca</button>
      <button class="btn ghost" id="copyM">Copiar</button>
    </header>
    <div class="list" id="list"></div>
  </section>
</div>

<script>
(function(){
  "use strict";

  var VERSION = '4';

  // ---------------------------------------------------------------- helpers
  var $ = function(id){ return document.getElementById(id); };
  var cv = $('cv'), g = cv.getContext('2d');

  function fmt(t){
    if(!isFinite(t)) t = 0;
    if(t < 0) t = 0;
    var tot = Math.round(t*1000);
    var ms = tot % 1000, sec = (tot - ms)/1000;
    var h = Math.floor(sec/3600), m = Math.floor(sec/60)%60, s = sec%60;
    var p2 = function(n){ return n<10 ? '0'+n : ''+n; };
    var p3 = function(n){ return n<10 ? '00'+n : n<100 ? '0'+n : ''+n; };
    return (h ? h+':'+p2(m) : ''+m) + ':' + p2(s) + '.' + p3(ms);
  }
  function fmtShort(t){
    if(!isFinite(t)) t = 0;
    var h = Math.floor(t/3600), m = Math.floor(t/60)%60, s = Math.floor(t)%60;
    var p2 = function(n){ return n<10 ? '0'+n : ''+n; };
    return h ? h+':'+p2(m)+':'+p2(s) : m+':'+p2(s);
  }
  function mb(bytes){
    if(bytes >= 1073741824) return (bytes/1073741824).toFixed(2) + ' GB';
    return Math.round(bytes/1048576) + ' MB';
  }
  var toastEl = null, toastTimer = 0;
  function toast(msg, ms){
    if(toastEl) toastEl.remove();
    toastEl = document.createElement('div');
    toastEl.className = 'toast'; toastEl.textContent = msg;
    document.body.appendChild(toastEl);
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ if(toastEl){ toastEl.remove(); toastEl = null; } }, ms || 4000);
  }
  function busy(on, txt){
    $('busy').hidden = !on;
    if(txt) $('busyTxt').textContent = txt;
  }
  var HINT = 'Toca para posicionar · arrasta para deslocar';
  function hint(txt){ $('hint').textContent = txt || HINT; }

  // ---------------------------------------------------------------- state
  var state = {
    name: 'Exemplo',
    isDemo: true,
    size: 0,
    sr: null, bits: null, channels: null,
    dur: 0,
    peaks: null,        // {pk:Float32Array, n, fpb, filled}
    markers: [],
    view: {a:0, b:1},
    loop: false,
    scanToken: 0
  };
  var uid = 1;
  var objUrl = null;

  // ---------------------------------------------------------------- playback: <audio>, para o browser transmitir do disco
  // Ficheiros de show passam facilmente de 1 GB. Descodificar tudo para memória não é opção,
  // por isso a reprodução usa um elemento <audio> e a forma de onda é lida do ficheiro por fatias.
  var audio = new Audio();
  audio.preload = 'auto';
  audio.addEventListener('ended', function(){ syncPlayBtn(); draw(); });
  audio.addEventListener('play', function(){ syncPlayBtn(); tick(); });
  audio.addEventListener('pause', function(){ syncPlayBtn(); draw(); });

  function headTime(){ var t = audio.currentTime; return isFinite(t) ? t : 0; }
  function isPlaying(){ return !audio.paused && !audio.ended; }
  function play(){
    var p = audio.play();
    if(p && p['catch']) p['catch'](function(e){ toast('Não consegui reproduzir' + (e && e.message ? ' (' + e.message + ')' : '') + '.'); });
  }
  function pause(){ audio.pause(); }
  function toggle(){ isPlaying() ? pause() : play(); }
  function seek(t){
    t = Math.max(0, Math.min(state.dur || 0, t));
    try{ audio.currentTime = t; }catch(e){}
    draw();
  }
  function syncPlayBtn(){
    var b = $('play');
    b.textContent = isPlaying() ? '❚❚' : '▶';
    b.setAttribute('aria-label', isPlaying() ? 'Pausa' : 'Reproduzir');
  }

  // ---------------------------------------------------------------- leitura dos chunks do WAV (por fatias, sem carregar o ficheiro)
  function decodeText(bytes){
    var s;
    try{ s = new TextDecoder('utf-8', {fatal:false}).decode(bytes); }catch(e){ s = null; }
    if(s === null || s.indexOf(String.fromCharCode(0xFFFD)) >= 0){
      s = '';
      for(var i=0;i<bytes.length;i++) s += String.fromCharCode(bytes[i]);
    }
    return s.replace(/\0+$/,'').trim();
  }
  function tag4(u8, o){ return String.fromCharCode(u8[o],u8[o+1],u8[o+2],u8[o+3]); }
  function slice(file, a, b){ return file.slice(a, b).arrayBuffer(); }

  // devolve uma promessa com {sr,bits,channels,fmtTag,dataOffset,dataSize,cues,labels,lengths} ou null
  function scanWav(file){
    return slice(file, 0, 12).then(function(hb){
      var hu = new Uint8Array(hb);
      if(hu.length < 12) return null;
      var riff = tag4(hu, 0);
      if((riff !== 'RIFF' && riff !== 'RF64') || tag4(hu, 8) !== 'WAVE') return null;
      var out = { sr:null, bits:null, channels:null, fmtTag:null, dataOffset:null, dataSize:0,
                  cues:[], labels:{}, lengths:{}, rf64: riff === 'RF64', ds64Data:null };
      var size = file.size, pos = 12, guard = 0;

      function step(){
        if(pos + 8 > size || guard++ > 400) return out;
        return slice(file, pos, pos + 8).then(function(hbuf){
          var h = new Uint8Array(hbuf);
          if(h.length < 8) return out;
          var id = tag4(h, 0);
          var dv0 = new DataView(hbuf);
          var csz = dv0.getUint32(4, true);
          var body = pos + 8;
          var want = null;
          if(id === 'ds64') want = Math.min(csz, 96);
          else if(id === 'fmt ') want = Math.min(csz, 64);
          else if(id === 'cue ') want = Math.min(csz, 4 + 24*4096);
          else if(id === 'LIST') want = Math.min(csz, 4*1024*1024);
          if(id === 'data'){
            out.dataOffset = body;
            out.dataSize = (csz === 0xFFFFFFFF && out.ds64Data != null) ? out.ds64Data : Math.min(csz, size - body);
            if(csz === 0xFFFFFFFF && out.ds64Data == null) out.dataSize = size - body;
          }
          var after = function(){
            var adv = (csz === 0xFFFFFFFF) ? out.dataSize : csz;
            pos = body + adv + (adv & 1);
            return step();
          };
          if(want == null || want <= 0) return after();
          return slice(file, body, body + want).then(function(cb){
            parseChunk(out, id, cb);
            return after();
          });
        });
      }
      return step();
    })['catch'](function(){ return null; });
  }

  function parseChunk(out, id, cb){
    var dv = new DataView(cb), u8 = new Uint8Array(cb), i;
    if(id === 'ds64' && cb.byteLength >= 24){
      // tamanhos de 64 bit para ficheiros acima de 4 GB
      out.ds64Data = dv.getUint32(16, true) + dv.getUint32(20, true) * 4294967296;
    } else if(id === 'fmt ' && cb.byteLength >= 16){
      out.fmtTag = dv.getUint16(0, true);
      out.channels = dv.getUint16(2, true);
      out.sr = dv.getUint32(4, true);
      out.bits = dv.getUint16(14, true);
      if(out.fmtTag === 0xFFFE && cb.byteLength >= 26) out.fmtTag = dv.getUint16(24, true);
    } else if(id === 'cue ' && cb.byteLength >= 4){
      var n = dv.getUint32(0, true);
      for(i=0;i<n;i++){
        var o = 4 + i*24;
        if(o + 24 > cb.byteLength) break;
        out.cues.push({ id: dv.getUint32(o, true), sample: dv.getUint32(o+20, true) || dv.getUint32(o+4, true) });
      }
    } else if(id === 'LIST' && cb.byteLength >= 4 && tag4(u8, 0) === 'adtl'){
      var q = 4, end = cb.byteLength;
      while(q + 8 <= end){
        var sid = tag4(u8, q), ssize = dv.getUint32(q+4, true), sbody = q + 8;
        if(sbody + ssize > end) ssize = end - sbody;
        if((sid === 'labl' || sid === 'note') && ssize >= 4){
          var cid = dv.getUint32(sbody, true);
          var txt = decodeText(u8.subarray(sbody+4, sbody+ssize));
          if(txt && (sid === 'labl' || !out.labels[cid])) out.labels[cid] = txt;
        } else if(sid === 'ltxt' && ssize >= 20){
          var lid = dv.getUint32(sbody, true);
          var slen = dv.getUint32(sbody+4, true);
          if(slen > 0) out.lengths[lid] = slen;
          var lt = decodeText(u8.subarray(sbody+20, sbody+ssize));
          if(lt && !out.labels[lid]) out.labels[lid] = lt;
        }
        q = sbody + ssize + (ssize & 1);
      }
    }
  }

  // ---------------------------------------------------------------- forma de onda lida por fatias
  var TARGET_BUCKETS = 180000;
  function buildPeaksFromFile(file, info, token){
    var bps = info.bits >> 3, ch = info.channels, frameSize = bps * ch;
    if(!frameSize || info.dataOffset == null || !info.dataSize) return;
    if(info.fmtTag !== 1 && info.fmtTag !== 3){ hint('Forma de onda indisponível (áudio comprimido dentro do WAV)'); return; }
    var frames = Math.floor(info.dataSize / frameSize);
    if(frames < 1) return;

    var fpb = Math.max(1, Math.ceil(frames / TARGET_BUCKETS));
    var n = Math.ceil(frames / fpb);
    var pk = new Float32Array(n), rms = new Float32Array(n);
    state.peaks = { pk: pk, rms: rms, n: n, fpb: fpb, filled: 0, sr: info.sr };

    var SLICE_BYTES = 8 * 1024 * 1024;
    var bucketsPerSlice = Math.max(1, Math.floor(SLICE_BYTES / (fpb * frameSize)));
    var stride = Math.max(1, Math.floor(fpb / 24));   // amostras por bucket, suficiente para o desenho
    var b0 = 0;

    function nextSlice(){
      if(token !== state.scanToken) return;
      if(b0 >= n){ hint(); draw(); return; }
      var bEnd = Math.min(n, b0 + bucketsPerSlice);
      var byteA = info.dataOffset + b0 * fpb * frameSize;
      var byteB = Math.min(info.dataOffset + info.dataSize, info.dataOffset + bEnd * fpb * frameSize);
      slice(file, byteA, byteB).then(function(buf){
        if(token !== state.scanToken) return;
        fillBuckets(buf, info, pk, rms, b0, bEnd, fpb, frameSize, stride, frames);
        state.peaks.filled = bEnd;
        b0 = bEnd;
        hint('Forma de onda ' + Math.round(100*bEnd/n) + '%');
        draw();
        setTimeout(nextSlice, 0);
      })['catch'](function(){ hint('Não consegui ler o ficheiro todo para a forma de onda.'); });
    }
    nextSlice();
  }

  function fillBuckets(buf, info, pk, rms, b0, bEnd, fpb, frameSize, stride, totalFrames){
    var bits = info.bits, tag = info.fmtTag, ch = info.channels, bps = bits >> 3;
    var u8 = new Uint8Array(buf), dv = new DataView(buf);
    var i16 = null, f32 = null, i32 = null;
    if(tag === 1 && bits === 16) i16 = new Int16Array(buf, 0, Math.floor(buf.byteLength/2));
    else if(tag === 3 && bits === 32) f32 = new Float32Array(buf, 0, Math.floor(buf.byteLength/4));
    else if(tag === 1 && bits === 32) i32 = new Int32Array(buf, 0, Math.floor(buf.byteLength/4));

    for(var b=b0; b<bEnd; b++){
      var f0 = b*fpb, f1 = Math.min(totalFrames, f0 + fpb);
      var peak = 0, sum = 0, cnt = 0;
      for(var f=f0; f<f1; f+=stride){
        var local = (f - b0*fpb);
        for(var k=0;k<ch;k++){
          var v = 0, idx;
          if(i16){ idx = local*ch + k; if(idx < i16.length) v = i16[idx] / 32768; }
          else if(f32){ idx = local*ch + k; if(idx < f32.length) v = f32[idx]; }
          else if(i32){ idx = local*ch + k; if(idx < i32.length) v = i32[idx] / 2147483648; }
          else {
            var j = local*frameSize + k*bps;
            if(j + bps > u8.length) continue;
            if(bits === 24) v = ((((u8[j] | (u8[j+1] << 8) | (u8[j+2] << 16)) << 8) >> 8)) / 8388608;
            else if(bits === 8) v = (u8[j] - 128) / 128;
            else if(tag === 3 && bits === 64) v = dv.getFloat64(j, true);
            else if(bits === 16) v = dv.getInt16(j, true) / 32768;
            else v = 0;
          }
          sum += v*v; cnt++;
          if(v < 0) v = -v;
          if(v > peak) peak = v;
        }
      }
      pk[b] = peak > 1 ? 1 : peak;
      rms[b] = cnt ? Math.min(1, Math.sqrt(sum/cnt)) : 0;
    }
  }

  // forma de onda de formatos comprimidos (MP3, M4A…): só vale a pena em ficheiros pequenos
  function buildPeaksFromDecoded(file, token){
    var LIMIT = 120 * 1024 * 1024;
    if(file.size > LIMIT){ hint('Forma de onda indisponível neste formato acima de ' + mb(LIMIT) + '.'); return; }
    var AC = window.AudioContext || window.webkitAudioContext;
    if(!AC){ hint(); return; }
    hint('A analisar a forma de onda…');
    file.arrayBuffer().then(function(ab){
      if(token !== state.scanToken) return;
      var c = new AC();
      var ok = function(buffer){
        if(token !== state.scanToken){ try{ c.close(); }catch(e){} return; }
        var frames = buffer.length, chs = [], k;
        for(k=0;k<buffer.numberOfChannels;k++) chs.push(buffer.getChannelData(k));
        var fpb = Math.max(1, Math.ceil(frames / TARGET_BUCKETS));
        var n = Math.ceil(frames / fpb);
        var pk = new Float32Array(n), rms = new Float32Array(n);
        var stride = Math.max(1, Math.floor(fpb / 24));
        for(var b=0;b<n;b++){
          var f0=b*fpb, f1=Math.min(frames,f0+fpb), peak=0, sum=0, cnt=0;
          for(var f=f0; f<f1; f+=stride) for(k=0;k<chs.length;k++){ var v=chs[k][f]; sum+=v*v; cnt++; if(v<0) v=-v; if(v>peak) peak=v; }
          pk[b] = peak > 1 ? 1 : peak;
          rms[b] = cnt ? Math.min(1, Math.sqrt(sum/cnt)) : 0;
        }
        state.peaks = { pk:pk, rms:rms, n:n, fpb:fpb, filled:n, sr: buffer.sampleRate };
        state.sr = state.sr || buffer.sampleRate;
        state.channels = state.channels || buffer.numberOfChannels;
        renderMeta(); hint(); draw();
        try{ c.close(); }catch(e){}
      };
      var no = function(){ hint('Sem forma de onda: o browser não descodificou este formato.'); try{ c.close(); }catch(e){} };
      try{
        var p = c.decodeAudioData(ab, ok, no);
        if(p && p.then) p.then(ok)['catch'](no);
      }catch(e){ no(); }
    })['catch'](function(){ hint('Não consegui ler o ficheiro para a forma de onda.'); });
  }

  var _pr = [0, 0];
  function peakAt(t0, t1){
    var p = state.peaks;
    _pr[0] = 0; _pr[1] = 0;
    if(!p || !p.sr || !p.filled) return _pr;
    var b0 = Math.floor(t0 * p.sr / p.fpb), b1 = Math.ceil(t1 * p.sr / p.fpb);
    if(b1 <= b0) b1 = b0 + 1;
    b0 = Math.max(0, Math.min(p.filled - 1, b0));
    b1 = Math.max(b0 + 1, Math.min(p.filled, b1));
    var m = 0, r = 0;
    for(var i=b0;i<b1;i++){ if(p.pk[i] > m) m = p.pk[i]; if(p.rms[i] > r) r = p.rms[i]; }
    _pr[0] = m; _pr[1] = r;
    return _pr;
  }

  // ---------------------------------------------------------------- drawing
  var RULER = 22, FLAG = 18;
  function css(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
  var theme = {};
  function readTheme(){
    theme = {
      surface: css('--surface'), surface2: css('--surface-2'), line: css('--line'),
      ink: css('--ink'), muted: css('--muted'), wave: css('--wave'), waveSoft: css('--wave-soft'),
      marker: css('--marker'), markerSoft: css('--marker-soft'), play: css('--play'), grid: css('--grid')
    };
  }
  function niceStep(span, target){
    var steps = [0.05,0.1,0.25,0.5,1,2,5,10,15,30,60,120,300,600,900,1800,3600];
    for(var i=0;i<steps.length;i++) if(span/steps[i] <= target) return steps[i];
    return steps[steps.length-1];
  }
  function draw(){
    var w = cv.clientWidth, h = cv.clientHeight;
    if(!w || !h) return;
    var dpr = Math.min(2.5, window.devicePixelRatio || 1);
    if(cv.width !== Math.round(w*dpr) || cv.height !== Math.round(h*dpr)){
      cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr);
    }
    g.setTransform(dpr,0,0,dpr,0,0);
    g.clearRect(0,0,w,h);

    var a = state.view.a, b = state.view.b, span = b - a;
    if(!(span > 0)) span = 1;
    var wavTop = RULER, wavH = h - RULER, mid = wavTop + wavH/2;

    g.fillStyle = theme.surface2; g.fillRect(0,0,w,RULER);
    g.fillStyle = theme.line; g.fillRect(0,RULER-1,w,1);

    var stp = niceStep(span, Math.max(3, Math.floor(w/88)));
    g.font = '10.5px "IBM Plex Mono", monospace';
    g.textBaseline = 'middle';
    var t0 = Math.ceil(a/stp)*stp;
    for(var t=t0; t<=b+1e-9; t+=stp){
      var x = Math.round(((t-a)/span)*w) + 0.5;
      g.fillStyle = theme.grid; g.fillRect(x,RULER,1,wavH);
      g.fillStyle = theme.muted;
      g.fillText(stp < 1 ? fmt(t).replace(/(\.\d{2})\d$/,'$1') : fmtShort(t), x+4, RULER/2);
    }

    g.fillStyle = theme.markerSoft;
    state.markers.forEach(function(m){
      if(m.end == null || m.end <= a || m.t >= b) return;
      var x1 = ((Math.max(a,m.t)-a)/span)*w, x2 = ((Math.min(b,m.end)-a)/span)*w;
      g.globalAlpha = .34; g.fillRect(x1, wavTop, Math.max(1,x2-x1), wavH); g.globalAlpha = 1;
    });

    g.fillStyle = theme.line; g.fillRect(0, Math.round(mid)+0.5, w, 1);

    if(state.peaks && state.peaks.filled){
      var amp = (wavH/2) - 6, x2p, ta, tb, pr, hh;
      g.fillStyle = theme.waveSoft;
      for(x2p=0; x2p<w; x2p++){
        ta = a + (x2p/w)*span; tb = a + ((x2p+1)/w)*span;
        pr = peakAt(ta, tb);
        if(pr[0] <= 0) continue;
        hh = Math.max(1, pr[0]*amp*2);
        g.fillRect(x2p, mid - hh/2, 1, hh);
      }
      g.fillStyle = theme.wave;
      for(x2p=0; x2p<w; x2p++){
        ta = a + (x2p/w)*span; tb = a + ((x2p+1)/w)*span;
        pr = peakAt(ta, tb);
        if(pr[1] <= 0) continue;
        hh = Math.max(1, pr[1]*amp*2);
        g.fillRect(x2p, mid - hh/2, 1, hh);
      }
    }

    g.font = '600 10.5px "IBM Plex Sans", sans-serif';
    state.markers.forEach(function(m, i){
      if(m.t < a || m.t > b) return;
      var x = Math.round(((m.t-a)/span)*w) + 0.5;
      g.fillStyle = theme.marker;
      g.fillRect(x, RULER, 1.5, wavH);
      var label = String(i+1);
      var tw = g.measureText(label).width;
      var bw = Math.max(16, tw + 10);
      var bx = Math.min(w - bw - 1, x - 0.5);
      g.fillRect(bx, RULER, bw, FLAG - 4);
      g.fillStyle = theme.surface;
      g.textBaseline = 'middle';
      g.fillText(label, bx + (bw - tw)/2, RULER + (FLAG-4)/2 + 0.5);
    });

    var ht = headTime();
    if(ht >= a && ht <= b){
      var hx = Math.round(((ht-a)/span)*w) + 0.5;
      g.fillStyle = theme.play;
      g.fillRect(hx, 0, 1.5, h);
      g.beginPath(); g.moveTo(hx-5, 0); g.lineTo(hx+5, 0); g.lineTo(hx, 7); g.closePath(); g.fill();
    }

    $('tNow').textContent = fmt(ht);
    $('tDur').textContent = '/ ' + fmt(state.dur);
    highlightRow();
  }

  // ---------------------------------------------------------------- view
  function fitView(){ state.view.a = 0; state.view.b = Math.max(0.001, state.dur); draw(); }
  function zoom(factor, anchorT){
    if(!state.dur) return;
    var a = state.view.a, b = state.view.b, span = b - a;
    var at = anchorT == null ? headTime() : anchorT;
    if(at < a || at > b) at = a + span/2;
    var ns = Math.max(0.05, Math.min(state.dur, span*factor));
    var frac = span > 0 ? (at - a)/span : .5;
    var na = at - ns*frac, nb = na + ns;
    if(na < 0){ na = 0; nb = ns; }
    if(nb > state.dur){ nb = state.dur; na = Math.max(0, nb - ns); }
    state.view.a = na; state.view.b = nb;
    draw();
  }
  function ensureVisible(t){
    var a = state.view.a, b = state.view.b, span = b - a;
    if(span >= state.dur - 1e-6) return;
    if(t < a + span*0.08 || t > b - span*0.08){
      var na = Math.max(0, Math.min(state.dur - span, t - span/2));
      state.view.a = na; state.view.b = na + span;
    }
  }

  // ---------------------------------------------------------------- markers
  function sortMarkers(){ state.markers.sort(function(x,y){ return x.t - y.t; }); }
  function currentIndex(){
    var t = headTime(), idx = -1;
    for(var i=0;i<state.markers.length;i++) if(state.markers[i].t <= t + 0.001) idx = i;
    return idx;
  }
  function segment(){
    var i = currentIndex();
    if(i < 0) return null;
    var m = state.markers[i];
    var end = m.end != null ? m.end : (state.markers[i+1] ? state.markers[i+1].t : state.dur);
    return { a:m.t, b:end };
  }

  var rowEls = [];
  function renderList(){
    var list = $('list');
    list.textContent = '';
    rowEls = [];
    $('mCount').textContent = state.markers.length;
    if(!state.markers.length){
      var e = document.createElement('div');
      e.className = 'empty';
      e.innerHTML = 'Sem marcas neste ficheiro. Só o WAV transporta <em>cues</em> embebidos — MP3, M4A e afins não os guardam. No Reaper, confirma a opção de escrever os marcadores como cues nas definições do formato WAV ao fazer render. Em alternativa, exporta as marcas do Region/Marker Manager e abre o CSV aqui, ou carrega em <strong>+ Marca</strong>.';
      list.appendChild(e);
      return;
    }
    state.markers.forEach(function(m, i){
      var row = document.createElement('div');
      row.className = 'row';
      var go = document.createElement('button');
      go.className = 'go'; go.title = 'Ir para esta marca';
      var idx = document.createElement('span'); idx.className = 'idx'; idx.textContent = i+1;
      var tt = document.createElement('span'); tt.className = 't mono'; tt.textContent = fmt(m.t);
      go.appendChild(idx); go.appendChild(tt);
      if(m.end != null){
        var ln = document.createElement('span'); ln.className = 'len mono';
        ln.textContent = '▸ ' + fmt(m.end);

      }
      go.addEventListener('click', function(){ seek(m.t); ensureVisible(m.t); draw(); });

      var nm = document.createElement('input');
      nm.className = 'nm'; nm.value = m.name; nm.id = 'nm-' + m.id;

      var del = document.createElement('button');
      del.className = 'del'; del.textContent = '✕'; del.setAttribute('aria-label','Apagar marca');
      var armed = false, armTimer = 0;
      del.addEventListener('click', function(){
        if(!armed){
          armed = true; del.classList.add('arm'); del.textContent = 'Apagar?';
          armTimer = setTimeout(function(){ armed = false; del.classList.remove('arm'); del.textContent = '✕'; }, 2800);
          return;
        }
        clearTimeout(armTimer);
        state.markers = state.markers.filter(function(x){ return x.id !== m.id; });
        save(); renderList(); draw();
      });

      row.appendChild(go); row.appendChild(nm); row.appendChild(del);
      list.appendChild(row);
      rowEls.push(row);
    });
  }
  function highlightRow(){
    var i = currentIndex();
    for(var k=0;k<rowEls.length;k++) rowEls[k].classList.toggle('active', k === i);
  }

  // ---------------------------------------------------------------- import de marcas em texto
  function parseTime(str){
    if(str == null) return null;
    var s = String(str).trim().replace(',', '.');
    if(!s) return null;
    if(/^-?\d+(\.\d+)?$/.test(s)) return parseFloat(s);
    var m = s.match(/^(?:(\d+):)?(\d{1,2}):(\d{1,2}(?:\.\d+)?)$/);
    if(m) return (parseInt(m[1]||'0',10))*3600 + parseInt(m[2],10)*60 + parseFloat(m[3]);
    return null;
  }
  function splitRow(line){
    if(line.indexOf('\t') >= 0) return line.split('\t');
    var out = [], cur = '', q = false;
    for(var i=0;i<line.length;i++){
      var c = line[i];
      if(c === '"'){ if(q && line[i+1] === '"'){ cur += '"'; i++; } else q = !q; }
      else if(c === ',' && !q){ out.push(cur); cur = ''; }
      else cur += c;
    }
    out.push(cur);
    return out;
  }
  function parseMarkerText(text){
    var lines = text.split(/\r?\n/).filter(function(l){ return l.trim() !== ''; });
    if(!lines.length) return [];
    var head = null, startI = -1, endI = -1, nameI = -1, body = lines;
    var first = splitRow(lines[0]).map(function(c){ return c.trim().toLowerCase(); });
    if(first.some(function(c){ return c === 'start' || c === 'início' || c === 'inicio'; })){
      head = first; body = lines.slice(1);
      for(var i=0;i<head.length;i++){
        if(startI < 0 && (head[i]==='start'||head[i]==='início'||head[i]==='inicio')) startI = i;
        else if(endI < 0 && (head[i]==='end'||head[i]==='fim')) endI = i;
        else if(nameI < 0 && (head[i]==='name'||head[i]==='nome')) nameI = i;
      }
    }
    var res = [];
    body.forEach(function(line){
      var c = splitRow(line).map(function(x){ return x.trim().replace(/^"|"$/g,''); });
      var t = null, e = null, nm = '';
      if(head){
        t = parseTime(c[startI]);
        if(endI >= 0) e = parseTime(c[endI]);
        nm = nameI >= 0 ? (c[nameI] || '') : '';
      } else {
        for(var i=0;i<c.length;i++){
          var v = parseTime(c[i]);
          if(v !== null){ if(t === null){ t = v; } else if(e === null){ e = v; } }
          else if(c[i] && !/^[MR]?\d+$/i.test(c[i])) nm = c[i];
        }
      }
      if(t === null) return;
      if(e !== null && e <= t) e = null;
      res.push({ id: uid++, t: t, end: e, name: nm || ('Marca ' + (res.length+1)) });
    });
    return res;
  }

  // ---------------------------------------------------------------- storage
  function storeKey(){
    if(state.isDemo || !state.dur) return null;
    return 'mwav:' + state.name + ':' + Math.round(state.dur*1000);
  }
  function save(){
    var k = storeKey(); if(!k) return;
    try{
      localStorage.setItem(k, JSON.stringify(state.markers.map(function(m){
        return { t:m.t, end:m.end, name:m.name };
      })));
    }catch(e){}
  }
  function load(){
    var k = storeKey(); if(!k) return null;
    try{
      var raw = localStorage.getItem(k);
      if(!raw) return null;
      var arr = JSON.parse(raw);
      if(!Array.isArray(arr) || !arr.length) return null;
      return arr.map(function(m){ return { id: uid++, t:+m.t, end: m.end == null ? null : +m.end, name: String(m.name||'') }; });
    }catch(e){ return null; }
  }

  // ---------------------------------------------------------------- meta
  function renderMeta(){
    var el = $('meta');
    el.textContent = '';
    var name = document.createElement('span'); name.className = 'name'; name.textContent = state.name;
    el.appendChild(name);
    if(state.isDemo){
      var tg = document.createElement('span'); tg.className = 'tag'; tg.textContent = 'exemplo';
      el.appendChild(tg);
    }
    var bits = [];
    bits.push(fmt(state.dur));
    if(state.sr) bits.push((state.sr/1000).toFixed(state.sr % 1000 ? 1 : 0) + ' kHz');
    if(state.channels) bits.push(state.channels === 1 ? 'mono' : state.channels === 2 ? 'estéreo' : state.channels + ' canais');
    if(state.bits) bits.push(state.bits + ' bit');
    if(state.size) bits.push(mb(state.size));
    var s = document.createElement('span'); s.className = 'mono'; s.textContent = bits.join('  ·  ');
    el.appendChild(s);
  }

  // ---------------------------------------------------------------- abrir ficheiro
  function openFile(file, isDemo){
    var token = ++state.scanToken;
    try{ audio.pause(); }catch(e){}
    if(objUrl){ try{ URL.revokeObjectURL(objUrl); }catch(e){} }
    objUrl = URL.createObjectURL(file);

    state.name = file.name; state.isDemo = !!isDemo; state.size = file.size;
    state.sr = null; state.bits = null; state.channels = null;
    state.peaks = null; state.dur = 0; state.markers = [];
    renderMeta(); renderList(); hint(); draw();
    busy(true, 'A abrir ' + mb(file.size) + '…');

    var metaDone = false, scanDone = false, info = null;

    function finish(){
      if(!metaDone || !scanDone || token !== state.scanToken) return;
      busy(false);
      if(info){
        state.sr = info.sr; state.bits = info.bits; state.channels = info.channels;
        if(!isFinite(state.dur) || state.dur <= 0){
          var fsz = (info.bits >> 3) * info.channels;
          if(fsz) state.dur = Math.floor(info.dataSize / fsz) / info.sr;
        }
      }
      var embedded = [];
      if(info && info.cues.length){
        var sr = info.sr || 48000;
        info.cues.forEach(function(q, i){
          var len = info.lengths[q.id];
          embedded.push({ id: uid++, t: q.sample / sr,
                          end: len ? (q.sample + len) / sr : null,
                          name: info.labels[q.id] || ('Cue ' + (i+1)) });
        });
      }
      var saved = load();
      if(saved){ state.markers = saved; toast('Marcas guardadas neste dispositivo restauradas (' + saved.length + ').'); }
      else {
        state.markers = embedded;
        if(embedded.length) toast(embedded.length + ' marca' + (embedded.length>1?'s':'') + ' lida' + (embedded.length>1?'s':'') + ' do ficheiro.');
        else if(!isDemo) toast('Ficheiro aberto. Não traz cues embebidos — importa o CSV ou usa "+ Marca".', 5000);
      }
      sortMarkers(); renderMeta(); renderList(); fitView(); syncPlayBtn();

      if(info) buildPeaksFromFile(file, info, token);
      else buildPeaksFromDecoded(file, token);
    }

    audio.onloadedmetadata = function(){
      if(token !== state.scanToken) return;
      state.dur = isFinite(audio.duration) ? audio.duration : 0;
      metaDone = true; finish();
    };
    audio.onerror = function(){
      if(token !== state.scanToken) return;
      busy(false);
      toast('O browser não conseguiu abrir este ficheiro de áudio.', 6000);
      metaDone = true; finish();
    };
    audio.src = objUrl;
    audio.load();

    scanWav(file).then(function(res){
      if(token !== state.scanToken) return;
      info = res; scanDone = true; finish();
    })['catch'](function(){
      if(token !== state.scanToken) return;
      info = null; scanDone = true; finish();
    });
  }

  function openMarkerFile(file){
    var fr = new FileReader();
    fr.onload = function(){
      var found;
      try{ found = parseMarkerText(String(fr.result)); }catch(e){ found = []; }
      if(!found.length){ toast('Não encontrei marcas nesse ficheiro.'); return; }
      state.markers = found;
      sortMarkers(); save(); renderList(); draw();
      toast(found.length + ' marca' + (found.length>1?'s':'') + ' importada' + (found.length>1?'s':'') + '.');
    };
    fr.onerror = function(){ toast('Não foi possível ler o ficheiro de marcas.'); };
    fr.readAsText(file);
  }

  // ---------------------------------------------------------------- exemplo (WAV real, com cues)
  function demoFile(){
    var sr = 44100, secs = 16, frames = sr*secs;
    var hits = [0.4, 3.2, 7.6, 12.1];
    var pcm = new Int16Array(frames);
    for(var i=0;i<frames;i++){
      var t = i/sr;
      var bed = Math.sin(2*Math.PI*110*t) * 0.06 * (0.6 + 0.4*Math.sin(2*Math.PI*0.23*t));
      var env = 0;
      for(var k=0;k<hits.length;k++){
        var d = t - hits[k];
        if(d >= 0 && d < 2.6) env += Math.exp(-d*1.9) * (0.55 - k*0.05);
      }
      var tone = Math.sin(2*Math.PI*(220 + 40*Math.sin(2*Math.PI*1.7*t))*t);
      var noise = (Math.random()*2-1) * 0.25;
      var v = bed + env*(tone*0.7 + noise);
      pcm[i] = Math.max(-32767, Math.min(32767, Math.round(v*32767)));
    }
    var names = ['Pré-show','Entrada banda','Solo — followspot','Blackout'];
    var regions = [Math.round(2.7*sr), 0, Math.round(4.4*sr), 0];

    // chunks
    var enc = function(s){ var b = []; for(var i=0;i<s.length;i++){ var c = s.charCodeAt(i);
      if(c < 128) b.push(c); else if(c < 2048){ b.push(192|c>>6, 128|c&63); } else { b.push(224|c>>12, 128|(c>>6)&63, 128|c&63); } }
      b.push(0); if(b.length & 1) b.push(0); return new Uint8Array(b); };
    var labls = names.map(function(nm,i){ return { id:i+1, txt:enc(nm) }; });
    var adtlLen = 4;
    labls.forEach(function(l){ adtlLen += 8 + 4 + l.txt.length; });
    regions.forEach(function(r,i){ if(r) adtlLen += 8 + 20; });

    var cueLen = 4 + 24*hits.length;
    var dataLen = pcm.length*2;
    var total = 4 + (8+16) + (8+dataLen) + (8+cueLen) + (8+adtlLen);
    var buf = new ArrayBuffer(8 + total);
    var dv = new DataView(buf), u8 = new Uint8Array(buf), o = 0;
    var W = function(s){ for(var i=0;i<s.length;i++) u8[o++] = s.charCodeAt(i); };
    var U32 = function(v){ dv.setUint32(o, v, true); o += 4; };
    var U16 = function(v){ dv.setUint16(o, v, true); o += 2; };
    W('RIFF'); U32(total); W('WAVE');
    W('fmt '); U32(16); U16(1); U16(1); U32(sr); U32(sr*2); U16(2); U16(16);
    W('data'); U32(dataLen);
    new Int16Array(buf, o, pcm.length).set(pcm); o += dataLen;
    W('cue '); U32(cueLen); U32(hits.length);
    hits.forEach(function(t,i){
      var smp = Math.round(t*sr);
      U32(i+1); U32(smp); W('data'); U32(0); U32(0); U32(smp);
    });
    W('LIST'); U32(adtlLen); W('adtl');
    labls.forEach(function(l){ W('labl'); U32(4 + l.txt.length); U32(l.id); u8.set(l.txt, o); o += l.txt.length; });
    regions.forEach(function(r,i){ if(!r) return; W('ltxt'); U32(20); U32(i+1); U32(r); W('rgn '); U16(0); U16(0); U16(0); U16(0); });

    var blob = new Blob([buf], {type:'audio/wav'});
    try{ return new File([blob], 'Exemplo — alinhamento de show.wav', {type:'audio/wav'}); }
    catch(e){ blob.name = 'Exemplo — alinhamento de show.wav'; return blob; }
  }

  // ---------------------------------------------------------------- pointer
  var drag = null;
  function timeAtX(x){
    var w = cv.clientWidth || 1;
    return state.view.a + (x/w)*(state.view.b - state.view.a);
  }
  cv.addEventListener('pointerdown', function(ev){
    cv.setPointerCapture(ev.pointerId);
    var r = cv.getBoundingClientRect();
    drag = { x0: ev.clientX - r.left, a0: state.view.a, b0: state.view.b, moved:false, t0: Date.now() };
  });
  cv.addEventListener('pointermove', function(ev){
    if(!drag) return;
    var r = cv.getBoundingClientRect();
    var x = ev.clientX - r.left, dx = x - drag.x0;
    if(Math.abs(dx) > 7) drag.moved = true;
    if(!drag.moved) return;
    var w = cv.clientWidth || 1, span = drag.b0 - drag.a0;
    var na = Math.max(0, Math.min(Math.max(0, state.dur - span), drag.a0 - (dx/w)*span));
    state.view.a = na; state.view.b = na + span;
    draw();
  });
  cv.addEventListener('pointerup', function(ev){
    if(!drag) return;
    var r = cv.getBoundingClientRect();
    var x = ev.clientX - r.left;
    if(!drag.moved && Date.now() - drag.t0 < 700){
      var t = timeAtX(x);
      var w = cv.clientWidth || 1, span = state.view.b - state.view.a, tol = (14/w)*span;
      var best = null, bd = tol;
      state.markers.forEach(function(m){
        var d = Math.abs(m.t - t);
        if(d < bd){ bd = d; best = m; }
      });
      seek(best ? best.t : t);
    }
    drag = null;
  });
  cv.addEventListener('pointercancel', function(){ drag = null; });
  cv.addEventListener('wheel', function(ev){
    if(!state.dur) return;
    ev.preventDefault();
    var r = cv.getBoundingClientRect();
    zoom(ev.deltaY > 0 ? 1.25 : 0.8, timeAtX(ev.clientX - r.left));
  }, {passive:false});

  // ---------------------------------------------------------------- controls
  $('pick').addEventListener('change', function(e){ if(e.target.files[0]) openFile(e.target.files[0], false); e.target.value=''; });
  $('pickCsv').addEventListener('change', function(e){ if(e.target.files[0]) openMarkerFile(e.target.files[0]); e.target.value=''; });
  $('play').addEventListener('click', toggle);
  $('prev').addEventListener('click', function(){
    var t = headTime(), cur = null;
    for(var i=0;i<state.markers.length;i++) if(state.markers[i].t <= t - 0.35) cur = state.markers[i];
    var target = cur ? cur.t : 0;
    seek(target); ensureVisible(target); draw();
  });
  $('next').addEventListener('click', function(){
    var t = headTime(), m = null;
    for(var i=0;i<state.markers.length;i++) if(state.markers[i].t > t + 0.02){ m = state.markers[i]; break; }
    var target = m ? m.t : state.dur;
    seek(target); ensureVisible(target); draw();
  });
  $('loop').addEventListener('click', function(){
    state.loop = !state.loop;
    this.setAttribute('aria-pressed', state.loop ? 'true' : 'false');
    if(state.loop){
      var s = segment();
      toast(s ? 'Loop entre ' + fmt(s.a) + ' e ' + fmt(s.b) : 'Loop ativo a partir da próxima marca.');
    }
  });
  $('zin').addEventListener('click', function(){ zoom(0.5); });
  $('zout').addEventListener('click', function(){ zoom(2); });
  $('zfit').addEventListener('click', fitView);
  $('addM').addEventListener('click', function(){
    var t = headTime();
    state.markers.push({ id: uid++, t: t, end: null, name: 'Marca ' + (state.markers.length+1) });
    sortMarkers(); save(); renderList(); draw();
    var m = null;
    for(var i=0;i<state.markers.length;i++) if(Math.abs(state.markers[i].t - t) < 1e-9) m = state.markers[i];
    if(m){ var el = document.getElementById('nm-' + m.id); if(el){ el.focus(); el.select(); } }
  });
  $('copyM').addEventListener('click', function(){
    if(!state.markers.length){ toast('Não há marcas para copiar.'); return; }
    var txt = state.markers.map(function(m,i){
      return (i+1) + '\t' + fmt(m.t) + (m.end != null ? '\t' + fmt(m.end) : '\t') + '\t' + m.name;
    }).join('\n');
    var ok = function(){ toast('Lista copiada.'); };
    var no = function(){
      var ta = document.createElement('textarea');
      ta.value = txt; ta.style.position='fixed'; ta.style.left='-9999px';
      document.body.appendChild(ta); ta.select();
      try{ document.execCommand('copy'); ok(); }catch(e){ toast('Não consegui copiar neste browser.'); }
      ta.remove();
    };
    if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(ok)['catch'](no);
    else no();
  });

  document.addEventListener('keydown', function(ev){
    if(ev.target && /input|textarea/i.test(ev.target.tagName)) return;
    if(ev.code === 'Space'){ ev.preventDefault(); toggle(); }
    else if(ev.key === 'ArrowRight'){ ev.preventDefault(); $('next').click(); }
    else if(ev.key === 'ArrowLeft'){ ev.preventDefault(); $('prev').click(); }
    else if(ev.key === 'm' || ev.key === 'M'){ $('addM').click(); }
  });

  // ---------------------------------------------------------------- loop de desenho
  var raf = 0;
  function tick(){
    cancelAnimationFrame(raf);
    var t = headTime();
    if(state.loop && isPlaying()){
      var s = segment();
      if(s && t >= s.b - 0.02){ seek(s.a); t = s.a; }
    }
    if(isPlaying()) ensureVisible(t);
    $('tDur').textContent = '/ ' + fmt(state.dur);
    draw();
    if(isPlaying()) raf = requestAnimationFrame(tick);
  }

  // ---------------------------------------------------------------- boot
  readTheme();
  $('ver').textContent = 'v' + VERSION;
  var mq = window.matchMedia('(prefers-color-scheme: dark)');
  if(mq.addEventListener) mq.addEventListener('change', function(){ readTheme(); draw(); });
  new MutationObserver(function(){ readTheme(); draw(); })
    .observe(document.documentElement, {attributes:true, attributeFilter:['data-theme']});
  var ro = new ResizeObserver(function(){ draw(); });
  ro.observe(cv);
  window.addEventListener('resize', function(){ readTheme(); draw(); });
  setInterval(function(){ if(!isPlaying()) draw(); }, 400);

  syncPlayBtn();
  openFile(demoFile(), true);
})();
</script>

<script>
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  });
}
</script>
